name: GitHub Pages

on:
  push:
    paths:
      - "nvim/lua/**"
      - "nvim/docs/cheatsheet.typ"
      - "pages/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TYPST_VERSION: "0.15.1"
      HUGO_VERSION: "0.166.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts used by the cheat sheet
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-dejavu-core

      - name: Install typst
        run: |
          curl -sL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o typst.tar.xz
          tar xf typst.tar.xz
          sudo mv "typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Install Hugo
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz" \
            -o hugo.tar.gz
          mkdir hugo-extract
          tar xf hugo.tar.gz -C hugo-extract
          sudo mv hugo-extract/hugo /usr/local/bin/hugo
          hugo version

      - name: Build landing page
        run: |
          mkdir -p site
          hugo --source pages --destination "$GITHUB_WORKSPACE/site"

      - name: Compile cheat sheet
        run: |
          mkdir -p site
          typst compile nvim/docs/cheatsheet.typ site/nvim-cheatsheet.pdf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvim-cheatsheet
          path: site/nvim-cheatsheet.pdf
          retention-days: 90

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
