# Age-based cleanup of personal scratch folders, run by systemd-tmpfiles-clean.timer (user).
# See tmpfiles.d(5). "e" = clean only if it exists, never create.
# A file is removed only when ALL of its timestamps (atime/mtime/btime/ctime) are older than Age.
# Preview: systemd-tmpfiles --user --clean --dry-run
#
# Type Path            Mode User Group Age
e      %h/Downloads    -    -    -     30d
e      %h/tmp          -    -    -     10d
